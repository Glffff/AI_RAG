    "openai>=1.0.0",
    "sentence-transformers>=2.2.0",
    "python-dotenv>=1.0.0",
    "pymupdf>=1.27.2.3",
    "numpy>=1.21,<2",
    "ollama>=0.6.2",
    "fastapi>=0.136.1",
    "uvicorn>=0.46.0",
